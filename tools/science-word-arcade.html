<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Science Word Arcade</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4fbf7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(#dcfce7 1px,transparent 1px) 0 0/20px 20px;min-height:100vh}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dbe5df;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:1.1rem}.hud{display:flex;gap:18px;font-weight:800}.wrap{max-width:900px;margin:auto;padding:24px}.hero{text-align:center;padding:28px 12px}.hero h1{font-size:clamp(2rem,6vw,3.8rem);margin:.2em 0}.hero p{color:#64748b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.mode,.card{background:#fff;border:1px solid #dbe5df;border-radius:20px;padding:22px;box-shadow:0 7px 0 #e2e8f0}.mode{cursor:pointer;text-align:left;transition:.15s}.mode:hover{transform:translateY(-2px);border-color:#60a5fa}.mode span{font-size:2rem}.mode h3{margin:.5rem 0}.mode p{color:#64748b}.hidden{display:none!important}.game{max-width:720px;margin:auto}.bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:14px 0 24px}.bar i{display:block;height:100%;background:#3b82f6;width:0;transition:.25s}.meta{display:flex;justify-content:space-between;gap:12px;color:#64748b;font-weight:800;font-size:.85rem}.question{text-align:center;font-size:1.55rem;font-weight:900;line-height:1.35;margin:30px auto;max-width:620px}.scenario{display:block;color:#2563eb;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answer,.button{border:1px solid #cbd5e1;background:#fff;border-radius:14px;padding:15px;font-weight:800;cursor:pointer}.answer:hover{border-color:#3b82f6;background:#eff6ff}.answer.correct{border-color:#22c55e;background:#f0fdf4;color:#15803d}.answer.wrong{border-color:#ef4444;background:#fef2f2;color:#b91c1c}.feedback{margin-top:18px;padding:16px;border-radius:14px;background:#eff6ff;border:1px solid #bfdbfe}.feedback.bad{background:#fff7ed;border-color:#fed7aa}.actions{display:flex;gap:10px;margin-top:16px}.button.primary{background:#2563eb;color:#fff;border-color:#2563eb}.review article{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin:10px 0}.review strong{color:#15803d}.summary{text-align:center}.summary .score{font-size:3.5rem;font-weight:1000;color:#2563eb}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.summary-grid div{background:#f8fafc;border-radius:12px;padding:12px}.pill{display:inline-flex;background:#e0f2fe;color:#0369a1;padding:5px 9px;border-radius:999px;font-weight:800;font-size:.75rem}@media(max-width:650px){.grid,.answers{grid-template-columns:1fr}.wrap{padding:16px}.top{align-items:flex-start}.hud{gap:9px;font-size:.85rem}.summary-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">🧪 Science Word Arcade</div><div class="hud"><span>Score <b id="score">0</b></span><span>❤️ <b id="lives">3</b></span><span>🔥 <b id="streak">0</b></span></div></header><main class="wrap"><section id="menu"><div class="hero"><span class="pill">GCSE Science exam skills</span><h1>Master Your Exam Skills</h1><p>Based on your Science Word Arcade. Choose a training module; questions are shuffled each run.</p></div><div class="grid"><button class="mode" data-mode="commands"><span>⌨️</span><h3>Command Cracker</h3><p>Master words such as evaluate, suggest, calculate, compare and justify.</p></button><button class="mode" data-mode="describeVsExplain"><span>⚖️</span><h3>Describe vs Explain</h3><p>Practise recognising when to state what happens and when to explain why.</p></button><button class="mode" data-mode="variables"><span>🎚️</span><h3>Variable Vault</h3><p>Identify independent, dependent and control variables in investigations.</p></button><button class="mode" data-mode="vocab"><span>🎯</span><h3>Vocab Target</h3><p>Accuracy, precision, resolution, errors, repeatability and validity.</p></button></div></section><section id="game" class="game card hidden"><div class="meta"><button class="button" id="quit">← Menu</button><span id="counter">Q 1/10</span><span id="moduleName"></span></div><div class="bar"><i id="progress"></i></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="next" class="button primary hidden">Next question →</button></div></section><section id="end" class="card summary hidden"><div id="endIcon" style="font-size:3rem">🏆</div><h2 id="endTitle">Module complete</h2><div class="score" id="finalScore">0</div><div class="summary-grid"><div><small>Accuracy</small><strong id="accuracy">0%</strong></div><div><small>Best streak</small><strong id="bestStreak">0</strong></div><div><small>Correct</small><strong id="correctTotal">0</strong></div></div><div class="actions" style="justify-content:center"><button id="reviewBtn" class="button">Review errors</button><button id="menuBtn" class="button primary">Back to menu</button></div><div id="review" class="review hidden"></div></section></main><script>const DB={commands:[{q:"Which word means to recall facts, events or processes accurately?",o:["Describe","Explain","Evaluate","State"],a:"Describe",h:"Describe tells the examiner what happens or what is present."},{q:"Which word means to make something clear or give reasons for it?",o:["State","Describe","Explain","Calculate"],a:"Explain",h:"Explain needs scientific reasons or mechanisms."},{q:"Which word asks you to consider evidence for and against before making a judgement?",o:["Compare","Evaluate","Suggest","Determine"],a:"Evaluate",h:"Evaluation weighs evidence and finishes with a supported judgement."},{q:"Which word asks for similarities and/or differences?",o:["Compare","State","Explain","Evaluate"],a:"Compare",h:"Use paired statements such as both, whereas or however."},{q:"Which word asks you to propose a sensible possible answer using your knowledge?",o:["Suggest","Calculate","Define","Outline"],a:"Suggest",h:"A suggestion should be scientifically plausible and linked to the context."},{q:"Which word asks for the exact meaning of a term?",o:["Define","Describe","Evaluate","Predict"],a:"Define",h:"Give a precise scientific meaning."},{q:"Which word asks you to work out an answer using numbers?",o:["Calculate","Determine","Estimate","Plot"],a:"Calculate",h:"Show your equation, substitution, working and unit."},{q:"Which word means support an answer or conclusion with evidence?",o:["Justify","Describe","State","Outline"],a:"Justify",h:"Give evidence or a scientific reason that supports the choice."},{q:"Which word asks for a short precise fact without explanation?",o:["State","Explain","Evaluate","Compare"],a:"State",h:"Keep it concise and factual."},{q:"Which word means reach a conclusion from information provided?",o:["Deduce","Suggest","Predict","Sketch"],a:"Deduce",h:"Use the evidence given to infer the answer."},{q:"Which word asks only for differences?",o:["Contrast","Compare","Describe","Evaluate"],a:"Contrast",h:"Contrast focuses on differences."},{q:"Which word asks you to mark data points accurately on a graph?",o:["Plot","Sketch","Draw","Calculate"],a:"Plot",h:"Plot requires accurate coordinates."}],describeVsExplain:[{q:"The line on the graph rises steadily then levels off.",o:["Describe","Explain"],a:"Describe",h:"It states what the graph does but not why."},{q:"The rate increases because there are more frequent successful collisions.",o:["Describe","Explain"],a:"Explain",h:"It gives a scientific mechanism."},{q:"What happens to current when more lamps are added in series?",o:["Requires a Description","Requires an Explanation"],a:"Requires a Description",h:"The question asks what happens."},{q:"Why does a gas increase in pressure when heated in a fixed container?",o:["Requires a Description","Requires an Explanation"],a:"Requires an Explanation",h:"Why requires the particle mechanism."},{q:"The initial temperature was 20°C and rose to 45°C.",o:["Describe","Explain"],a:"Describe",h:"This reports data only."},{q:"The object accelerates because the resultant force is non-zero.",o:["Describe","Explain"],a:"Explain",h:"The sentence links observation to a physics principle."},{q:"Plant A grew 5 cm taller than Plant B.",o:["Describe","Explain"],a:"Describe",h:"This is an observed difference."},{q:"Plant A grew faster because greater light intensity increased photosynthesis.",o:["Describe","Explain"],a:"Explain",h:"It gives the biological cause."},{q:"The pH fell as hydrogen ion concentration increased.",o:["Describe","Explain"],a:"Explain",h:"It connects the trend to the chemical cause."},{q:"The car slowed as it approached the traffic lights.",o:["Describe","Explain"],a:"Describe",h:"No force or mechanism is given."}],variables:[{s:"Testing how light intensity affects photosynthesis.",q:"Distance from the lamp is the...",o:["Independent Variable","Dependent Variable","Control Variable"],a:"Independent Variable",h:"It is deliberately changed to alter light intensity."},{s:"Testing how light intensity affects photosynthesis.",q:"Oxygen produced per minute is the...",o:["Independent Variable","Dependent Variable","Control Variable"],a:"Dependent Variable",h:"It is the measured outcome."},{s:"Testing how light intensity affects photosynthesis.",q:"Species and size of pondweed is a...",o:["Independent Variable","Dependent Variable","Control Variable"],a:"Control Variable",h:"It should be kept the same for validity."},{s:"Investigating osmosis in potato tissue.",q:"Sugar solution concentration is the...",o:["Independent Variable","Dependent Variable","Control Variable"],a:"Independent Variable",h:"The investigator chooses the concentrations."},{s:"Investigating osmosis in potato tissue.",q:"Percentage change in mass is the...",o:["Independent Variable","Dependent Variable","Control Variable"],a:"Dependent Variable",h:"It is calculated from the results."},{s:"Investigating enzyme activity.",q:"Water-bath temperature is the...",o:["Independent Variable","Dependent Variable","Control Variable"],a:"Independent Variable",h:"It is deliberately changed."},{s:"Investigating enzyme activity.",q:"Time for starch to disappear is the...",o:["Independent Variable","Dependent Variable","Control Variable"],a:"Dependent Variable",h:"It is the measured outcome."},{s:"Investigating rate using marble chips and acid.",q:"Acid concentration when testing surface area is a...",o:["Independent Variable","Dependent Variable","Control Variable"],a:"Control Variable",h:"It must stay constant so only surface area changes."},{s:"Investigating spring extension.",q:"Force added to the spring is the...",o:["Independent Variable","Dependent Variable","Control Variable"],a:"Independent Variable",h:"This is the quantity deliberately changed."},{s:"Investigating spring extension.",q:"Spring extension is the...",o:["Independent Variable","Dependent Variable","Control Variable"],a:"Dependent Variable",h:"This is the measured response."},{s:"Investigating wire resistance.",q:"Wire length is the...",o:["Independent Variable","Dependent Variable","Control Variable"],a:"Independent Variable",h:"Different lengths are deliberately tested."},{s:"Investigating wire resistance.",q:"Wire thickness is a...",o:["Independent Variable","Dependent Variable","Control Variable"],a:"Control Variable",h:"Changing thickness would affect resistance too."}],vocab:[{q:"A measurement close to the true value is...",o:["Accurate","Precise","Valid","Reliable"],a:"Accurate",h:"Accuracy is closeness to the true value."},{q:"Measurements with very little spread are...",o:["Accurate","Precise","Repeatable","Anomalous"],a:"Precise",h:"Precision describes closeness of repeated values to each other."},{q:"The smallest change an instrument can detect is its...",o:["Accuracy","Uncertainty","Resolution","Range"],a:"Resolution",h:"Higher resolution distinguishes smaller changes."},{q:"An error that shifts readings consistently is a...",o:["Random Error","Human Error","Systematic Error","Anomaly"],a:"Systematic Error",h:"Systematic errors affect readings in a consistent direction."},{q:"A result that does not fit the pattern is an...",o:["Mean","Anomaly","Control","Resolution"],a:"Anomaly",h:"An anomalous result does not fit the expected variation or trend."},{q:"When the same person repeats a method and gets similar results, measurements are...",o:["Reproducible","Repeatable","Accurate","Valid"],a:"Repeatable",h:"Repeatability concerns the same person and method/equipment."},{q:"When another person or different equipment gives similar results, they are...",o:["Reproducible","Repeatable","Precise","Valid"],a:"Reproducible",h:"Reproducibility checks whether findings can be reproduced independently."},{q:"The suitability of a method to answer the intended question is...",o:["Validity","Reliability","Accuracy","Precision"],a:"Validity",h:"A valid investigation actually tests the intended relationship."},{q:"A measuring instrument that reads non-zero when it should read zero has a...",o:["Random Error","Zero Error","Parallax Error","Range Error"],a:"Zero Error",h:"Check and correct the instrument zero before measuring."},{q:"Variation that changes unpredictably between readings is...",o:["Systematic Error","Random Error","Zero Error","Calibration"],a:"Random Error",h:"Repeats and averaging can reduce the influence of random error."}]};const names={commands:'Command Cracker',describeVsExplain:'Describe vs Explain',variables:'Variable Vault',vocab:'Vocab Target'};let st={mode:null,score:0,lives:3,streak:0,best:0,correct:0,index:0,pool:[],missed:[]};const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function show(id){['menu','game','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function hud(){$('score').textContent=st.score;$('lives').textContent=st.lives;$('streak').textContent=st.streak}function start(mode){st={mode,score:0,lives:3,streak:0,best:0,correct:0,index:0,pool:shuffle(DB[mode]).slice(0,20),missed:[]};$('moduleName').textContent=names[mode];hud();show('game');render()}function render(){const q=st.pool[st.index];$('counter').textContent=`Q ${st.index+1}/${st.pool.length}`;$('progress').style.width=`${((st.index+1)/st.pool.length)*100}%`;$('feedback').className='feedback hidden';$('next').classList.add('hidden');$('question').innerHTML=`${q.s?`<span class="scenario">${q.s}</span>`:''}${q.q}`;$('answers').innerHTML='';q.o.forEach(opt=>{const b=document.createElement('button');b.className='answer';b.textContent=opt;b.onclick=()=>check(b,opt,q);$('answers').appendChild(b)})}function check(btn,opt,q){[...$('answers').children].forEach(b=>b.disabled=true);const ok=opt===q.a;if(ok){st.streak++;st.best=Math.max(st.best,st.streak);st.correct++;st.score+=100+st.streak*10;btn.classList.add('correct');$('feedback').textContent=`Correct — ${q.h}`;$('feedback').className='feedback'}else{st.lives--;st.streak=0;st.missed.push({q:q.q,a:q.a,h:q.h});btn.classList.add('wrong');[...$('answers').children].forEach(b=>{if(b.textContent===q.a)b.classList.add('correct')});$('feedback').textContent=`Not quite. ${q.h}`;$('feedback').className='feedback bad'}hud();if(st.lives<=0){setTimeout(()=>finish(false),550)}else{$('next').classList.remove('hidden')}}function next(){st.index++;if(st.index>=st.pool.length)finish(true);else render()}function finish(completed){show('end');$('endIcon').textContent=completed?'🏆':'💔';$('endTitle').textContent=completed?'Module complete!':'Out of lives';$('finalScore').textContent=st.score;const attempted=Math.min(st.index+(completed?0:1),st.pool.length)||1;$('accuracy').textContent=`${Math.round(st.correct/attempted*100)}%`;$('bestStreak').textContent=st.best;$('correctTotal').textContent=st.correct;$('reviewBtn').classList.toggle('hidden',!st.missed.length);$('review').classList.add('hidden');localStorage.setItem('gcse-science-word-arcade-last',JSON.stringify({mode:st.mode,score:st.score,accuracy:Math.round(st.correct/attempted*100),date:new Date().toISOString()}));parent.postMessage({type:'gcse-course-tool-result',tool:'word-arcade',mode:st.mode,score:st.score,accuracy:Math.round(st.correct/attempted*100)},'*')}function review(){$('review').classList.toggle('hidden');$('review').innerHTML=st.missed.map((x,i)=>`<article><b>${i+1}. ${x.q}</b><p>Correct answer: <strong>${x.a}</strong></p><p>${x.h}</p></article>`).join('')}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));$('next').onclick=next;$('quit').onclick=() => show('menu');$('menuBtn').onclick=()=>show('menu');$('reviewBtn').onclick=review;hud();</script></body></html>
