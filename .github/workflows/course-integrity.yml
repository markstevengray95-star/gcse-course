name: GCSE Course Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check course-data.js
          node --check physics-spec-detail.js
          node --check biology-spec-detail.js
          node --check chemistry-spec-detail.js
          node --check spec-practical-sync.js
          node --check rich-content.js
          node --check question-bank.js
          node --check app.js
          node --check course-audit-fixes.js
          node --check course-enhancements.js
          node --check textbook-enhancements.js
          node --check textbook-phase1.js
          node --check textbook-phase2.js
          node --check textbook-phase3.js
          node --check science-diagrams.js
          node --check lesson-visuals.js
          node --check lesson-visual-interactions.js
          node --check equation-coach.js
          node --check equation-coach-ui.js
          node --check practical-lesson-engine.js
          node --check practical-lesson-ui.js
          node --check lesson-question-ladder.js
          node --check lesson-question-ladder-ui.js
          node --check lesson-exam-studio.js
          node --check lesson-exam-studio-ui.js
          node --check lesson-differentiation.js
          node --check lesson-differentiation-ui.js
          node --check lesson-mode-plans.js
          node --check lesson-teacher-mode.js
          node --check lesson-student-mode.js
          node --check lesson-notebook-organizer.js
          node --check lesson-mastery-actions.js
          node --check lesson-mastery-actions-ui.js
          node --check lesson-synoptic-connections.js
          node --check lesson-synoptic-ui.js
          node --check lesson-quality-review.js
          node --check lesson-quality-review-ui.js
          node --check lesson-quality-gates.js
          node --check lesson-quality-evidence.js
          node --check lesson-quality-evidence-ui.js
          node --check lesson-quality-enrichment.js
          node --check lesson-quality-enrichment-ui.js
          node --check lesson-specificity-review.js
          node --check lesson-specificity-ui.js
          node --check physics-lesson-content.js
          node --check biology-lesson-content.js
          node --check chemistry-lesson-content.js
          node --check lesson-sequences.js
          node --check revision-mode.js
          node --check physics-spec-ui.js
          node --check biology-spec-ui.js
          node --check chemistry-spec-ui.js
          node --check project-hub.js
          node --check course-polish.js
          node --check specification-completeness.js
          node --check integrated-tools.js
          node --check learning-flow.js
          node --check study-checkpoints.js
          node --check lesson-quality-schema.js
          node --check lesson-teaching-depth.js
          node --check lesson-presentation-catalog.js
          node --check presentation-lessons.js
          node --check interactive-presentations.js
          node --check presentation-teaching-tools.js
      - name: Validate existing course structure
        run: node tests/integrity.mjs
      - name: Run full AQA three-subject audit
        run: node tests/full-audit.mjs
      - name: Audit textbook diagrams and terminology
        run: node tests/textbook-audit.mjs
      - name: Audit textbook phase 1 digital chapter reader
        run: node tests/textbook-phase1-audit.mjs
      - name: Audit textbook phase 2 teaching structure
        run: node tests/textbook-phase2-audit.mjs
      - name: Audit textbook phase 3 interactive diagrams
        run: node tests/textbook-phase3-audit.mjs
      - name: Audit project hubs and navigation
        run: node tests/project-hub-audit.mjs
      - name: Audit simplified UI and notebook tools
        run: node tests/polish-audit.mjs
      - name: Audit complete AQA lesson coverage
        run: node tests/specification-completeness-audit.mjs
      - name: Audit integrated Arcade and Physics tools
        run: node tests/integrated-tools-audit.mjs
      - name: Audit guided learning flow
        run: node tests/learning-flow-audit.mjs
      - name: Audit study checkpoints and resume flow
        run: node tests/study-checkpoints-audit.mjs
      - name: Audit presentation-style lessons
        run: node tests/presentation-lessons-audit.mjs
      - name: Audit interactive presentations and scientific diagrams
        run: node tests/interactive-presentations-audit.mjs
      - name: Audit every individual lesson presentation
        run: node tests/all-lesson-presentations-audit.mjs
      - name: Audit presentation teaching controls and mastery
        run: node tests/presentation-teaching-tools-audit.mjs
      - name: Audit lesson overhaul phases 1 and 2
        run: node tests/lesson-overhaul-audit.mjs
      - name: Audit lesson overhaul phases 3 and 4
        run: node tests/lesson-overhaul-phase34-audit.mjs
      - name: Audit lesson overhaul phases 5 and 6
        run: node tests/lesson-overhaul-phase56-audit.mjs
      - name: Audit lesson overhaul phases 7 and 8
        run: node tests/lesson-overhaul-phase78-audit.mjs
      - name: Audit lesson overhaul phases 9 and 10
        run: node tests/lesson-overhaul-phase910-audit.mjs
      - name: Audit lesson overhaul phases 11 and 12
        run: node tests/lesson-overhaul-phase1112-audit.mjs
      - name: Audit lesson overhaul phases 13 and 14
        run: node tests/lesson-overhaul-phase1314-audit.mjs
      - name: Audit lesson overhaul phases 15 and 16
        run: node tests/lesson-overhaul-phase1516-audit.mjs
      - name: Audit lesson overhaul phases 17 and 18
        run: node tests/lesson-overhaul-phase1718-audit.mjs
      - name: Audit lesson overhaul phases 19 and 20
        run: node tests/lesson-overhaul-phase1920-audit.mjs
