name: GCSE Plans, Billing and Paper Guide

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-plans-billing-paper-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check plans-paper-guide.js
          node --check gcse-auth.js
          node --check gcse-billing-ui.js
          node --check gcse-access-control.js
          node --check revision-intelligence.js
          node --check exam-studio-revision-bridge.js
          node --check real-exam-mocks.js
          node --check teacher-platform.js
          node --check teacher-dashboard-phase2.js
          node --check teacher-homework.js
          node --check teacher-homework-autoload.js
          node --check teacher-assessments.js
          node --check teacher-assessment-revision-bridge.js
          node --check course-audit-fixes.js
      - name: Audit Supabase signup emails
        run: node tests/auth-email-integration-audit.mjs
      - name: Audit plan access controls
        run: node tests/access-control-audit.mjs
      - name: Audit smart revision features
        run: node tests/revision-intelligence-audit.mjs
      - name: Audit full timed exam papers
        run: node tests/real-exam-mocks-audit.mjs
      - name: Audit Teacher Platform phase 1
        run: node tests/teacher-platform-phase1-audit.mjs
      - name: Audit Teacher Platform phase 2
        run: node tests/teacher-platform-phase2-audit.mjs
      - name: Audit Teacher homework phase 3
        run: node tests/teacher-homework-phase3-audit.mjs
      - name: Audit Teacher assessment phase 4
        run: node tests/teacher-assessment-phase4-audit.mjs
      - name: Audit plans and paper guide
        run: node tests/plans-paper-guide-audit.mjs
      - name: Audit subscription and admin controls
        run: node tests/billing-admin-audit.mjs
      - name: Run course integrity
        run: node tests/integrity.mjs
      - name: Run full AQA audit
        run: node tests/full-audit.mjs
